apiVersion: apps/v1
kind: Deployment
metadata:
  name: digitalengn
  namespace: digitalengn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: digitalengn
  template:
    metadata:
      labels:
        app: digitalengn
    spec:
      containers:
      - name: digitalengn
        image: digitalengn:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: digitalengn
  namespace: digitalengn
spec:
  selector:
    app: digitalengn
  ports:
  - name: http
    port: 80
    targetPort: 3000
  type: ClusterIP
