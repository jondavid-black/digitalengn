apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digitalengn-ingress
  namespace: digitalengn
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - localhost
    secretName: digitalengn-tls
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: digitalengn
            port:
              number: 80
      - path: /plan
        pathType: Prefix
        backend:
          service:
            name: openproject
            port:
              number: 80
